<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IFC Drawing packet printer, under the hood</title>
<meta name="description" content="How the IFC Drawing packet printer is built: Outlook VBA, VBScript, PowerShell, Python and SumatraPDF, shown layer by layer with the real code.">

<script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-size:14px}
[hidden]{display:none!important}
/* Layout: a dark "engine room" stage. Left, an exploded isometric stack of the software layers with cables
   to the shared drive, Excel and the printers. Right, the real code for whichever layer is live.
   Page chrome follows the theme; the stage keeps one dark look in both themes. */
:root{
  --bg:#E8EDF2; --ink:#18222E; --muted:#56667A; --red:#D8443A; --green:#23905A; --accent:#2F68B0;
  --display:"Bricolage Grotesque","Arial Rounded MT Bold","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  /* stage palette, same in both themes */
  --k-bg:#0E1621; --k-bg2:#131E2C; --k-grid:#1E2B3B; --k-line:#2B3B50; --k-text:#E6EDF5; --k-muted:#8A9BB0;
  --k-vba:#8E6CEF; --k-vbs:#7C93B5; --k-ps:#3B82F6; --k-py:#F2C14E; --k-pdf:#F28C38; --k-xl:#2FA86A; --k-share:#5CC8E0;
  --k-ok:#4ADE80; --k-str:#F2C98A; --k-kw:#B79BFF; --k-com:#6F8299; --k-num:#7DD3FC;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0B121B; --ink:#E6EDF5; --muted:#9AAABD; --red:#FF7366; --green:#62D394; --accent:#7FB2F0; color-scheme:dark }
}
:root[data-theme="dark"]{ --bg:#0B121B; --ink:#E6EDF5; --muted:#9AAABD; --red:#FF7366; --green:#62D394; --accent:#7FB2F0; color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--body)}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:22px 34px;display:grid;gap:14px}
h1{font:800 clamp(28px,4.2vw,42px)/1.05 var(--display);letter-spacing:-.01em;margin:0;text-wrap:balance}

.stage{margin:0;position:relative;background:var(--k-bg);color:var(--k-text);border:3px solid #18222E;border-radius:14px;overflow:hidden;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.stage svg{display:block;width:100%;height:auto}
.diagram{min-width:0;background:radial-gradient(circle at 50% 45%, var(--k-bg2), var(--k-bg) 70%)}
.codecol{min-width:0;display:flex;flex-direction:column;border-left:1px solid var(--k-line);background:var(--k-bg)}
.tabbar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--k-line);background:var(--k-bg2);min-height:52px;flex-wrap:wrap}
.tab{font:600 13px var(--mono);color:var(--k-text);background:var(--k-bg);border:1px solid var(--k-line);border-bottom:2px solid var(--lang,var(--k-muted));padding:6px 10px;border-radius:6px 6px 0 0;white-space:nowrap}
.lang{font:800 11px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--k-bg);background:var(--lang,var(--k-muted));padding:4px 8px;border-radius:99px}
.where{margin-left:auto;font:600 11.5px var(--mono);color:var(--k-muted)}
.code{flex:1;margin:0;padding:16px 16px 18px;font:400 13px/1.62 var(--mono);color:var(--k-text);white-space:pre-wrap;tab-size:4;min-height:var(--code-h,360px)}
.code .row{display:block;padding-left:3.3em;text-indent:-3.3em;overflow-wrap:anywhere}
.code .ln{display:inline-block;width:2.2em;color:#3C4F66;text-align:right;margin-right:1.1em;user-select:none}
.code .k{color:var(--k-kw)} .code .s{color:var(--k-str)} .code .c{color:var(--k-com);font-style:italic} .code .n{color:var(--k-num)} .code .ok{color:var(--k-ok);font-weight:600}
.caret{display:inline-block;width:.6em;height:1.1em;vertical-align:-.18em;background:var(--lang,var(--k-text));animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.about{border-top:1px solid var(--k-line);padding:12px 16px 14px;font:400 14px/1.5 var(--body);color:var(--k-muted);min-height:66px}
.about b{color:var(--k-text);font-weight:700}

.ov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(14,22,33,.97);padding:24px;opacity:0;visibility:hidden}
.ov-title{text-align:center}
.ov-title .part{font:800 14px var(--display);letter-spacing:.2em;color:var(--k-py);text-transform:uppercase}
.ov-title h2{font:800 clamp(44px,8vw,104px)/0.95 var(--display);margin:.15em 0 .2em;letter-spacing:-.02em}
.ov-title p{font:400 clamp(15px,2vw,21px)/1.4 var(--body);color:var(--k-muted);margin:0}
.bom{width:min(900px,100%);max-height:100%;overflow:auto}
#ovBom{padding-bottom:84px}
.bom h2{font:800 clamp(22px,3vw,34px) var(--display);margin:0 0 4px}
.bom .sub{font:400 15px var(--body);color:var(--k-muted);margin:0 0 14px}
.bom table{width:100%;border-collapse:collapse;font:400 14px var(--body)}
.bom th{font:800 11px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--k-muted);text-align:left;padding:6px 8px;border-bottom:2px solid var(--k-line)}
.bom td{padding:7px 8px;border-bottom:1px solid var(--k-line);vertical-align:top}
.bom td:first-child{font:600 13px var(--mono);color:var(--k-muted);width:2.5em}
.bom td.part{font:600 13.5px var(--mono);white-space:nowrap}
.bom .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:0}
.bom .foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.bom .chip{font:800 13px var(--display);letter-spacing:.04em;border:1.5px solid var(--k-line);border-radius:99px;padding:6px 12px}
.bom tr{opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s}
.bom tr.in{opacity:1;transform:none}

.bigplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:10px;padding:14px 26px 14px 20px;border-radius:999px;background:var(--k-py);color:#18222E;border:3px solid #18222E;font:800 clamp(14px,2vw,21px) var(--display);letter-spacing:.04em;text-transform:uppercase;cursor:pointer;box-shadow:0 5px 0 #18222E;z-index:3}
.bigplay svg{width:1.3em;height:1.3em;fill:currentColor}
.bigplay.start{top:78%}
.bigplay.end{top:auto;bottom:18px;transform:translateX(-50%)}
.bigplay:focus-visible{outline:3px solid var(--k-share);outline-offset:3px}
.pill{position:absolute;top:12px;left:12px;font:800 13px var(--display);letter-spacing:.06em;text-transform:uppercase;background:var(--k-text);color:var(--k-bg);padding:6px 14px;border-radius:999px;pointer-events:none;z-index:3}
.caption{display:grid;gap:4px;min-height:100px;align-content:start}
.cap-act{font:800 12.5px var(--display);letter-spacing:.12em;margin:0;text-transform:uppercase;color:var(--accent)}
.caption h2{font:800 clamp(21px,2.6vw,27px)/1.15 var(--display);margin:0;text-wrap:balance}
#capP{margin:0;font-size:16px;line-height:1.55;max-width:70ch}
@media (max-width:860px){
  .stage{grid-template-columns:1fr}
  .codecol{border-left:0;border-top:1px solid var(--k-line)}
  .code{font-size:11px;padding:12px}
  #slabs .lbl-f{display:none}
  #slabs .lbl-t{font-size:21px}
  #mailChip text{font-size:14px}
  .bom th:nth-child(3),.bom td:nth-child(3){display:none}
  .about{font-size:13px}
  .bigplay{padding:8px 16px 8px 12px;font-size:13px;border-width:2px;box-shadow:0 3px 0 #18222E}
  .bigplay.start{top:76%}
  .pill{top:8px;left:8px;font-size:11px;padding:4px 10px}
  .pill .more{display:none}
  .caption{min-height:140px}
  .bom table{font-size:12.5px}
  .bom td.part{font-size:12px}
  #ovBom{padding:16px 16px 76px}
}
@media (prefers-reduced-motion: reduce){.caret{animation:none}.bom tr{transition:none}}

/* ---- diagram ---- */
.dot{fill:var(--k-grid)}
.lbl-t{font:800 17px var(--display);fill:var(--k-text)}
.lbl-f{font:600 12px var(--mono);fill:var(--k-muted)}
.leader{stroke:var(--k-line);stroke-width:1.5}
.cable{fill:none;stroke-width:3.5;stroke-linecap:round;opacity:.35}
.cable.on{opacity:1}
.pulse{stroke:none}
.ext rect.box{fill:var(--k-bg2);stroke:var(--k-line);stroke-width:2}
.ext.on rect.box{stroke-width:3}
.ext-t{font:800 15px var(--display);fill:var(--k-text)}
.ext-f{font:600 11px var(--mono);fill:var(--k-muted)}
.iso{font:800 30px var(--display)}
.chip-t{font:700 12px var(--mono)}
.tagpill{font:800 11px var(--display);letter-spacing:.08em}
.chk{fill:none;stroke:var(--k-ok);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.back{font:600 14px var(--body);color:var(--accent);text-decoration:none;justify-self:start}
.back:hover{text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
<script src="page-transition.js"></script>

<main class="wrap">
  <a class="back" href="./#projects">&larr; Back to all projects</a>
  <h1>IFC Drawing packet printer, under the hood</h1>

  <figure class="stage" id="stage">
    <div class="diagram">
      <svg id="dia" viewBox="0 0 720 760" role="img" aria-labelledby="diaT">
        <title id="diaT">Exploded view of the software stack: Outlook VBA, VBScript, PowerShell, Python and SumatraPDF, with cables to the shared drive, Excel and two printers.</title>
        <g id="dots"></g>
        <!-- incoming email -->
        <g id="mailChip">
          <rect x="296" y="16" width="128" height="34" rx="17" fill="#131E2C" stroke="#2B3B50" stroke-width="2"/>
          <rect x="312" y="25" width="22" height="16" rx="2" fill="none" stroke="#E6EDF5" stroke-width="2"/>
          <path d="M312 26l11 8 11-8" fill="none" stroke="#E6EDF5" stroke-width="2"/>
          <text x="342" y="39" class="lbl-f" style="fill:#E6EDF5">IFC email</text>
        </g>
        <line x1="360" y1="50" x2="360" y2="58" stroke="#2B3B50" stroke-width="2" stroke-dasharray="3 4"/>
        <g id="printedTag" style="opacity:0">
          <rect x="434" y="17" width="150" height="32" rx="16" fill="#123323" stroke="#4ADE80" stroke-width="2"/>
          <text x="509" y="38" class="tagpill" text-anchor="middle" style="fill:#4ADE80">✓ SHOP PRINTED</text>
        </g>

        <!-- cables -->
        <path id="cCom" d="M510 456C556 456 556 126 510 126" class="cable" style="stroke:var(--k-vba)"/>
        <path id="cShare" d="M510 456C540 456 540 361 566 361" class="cable" style="stroke:var(--k-share)"/>
        <path id="cExcel" d="M510 456C540 456 540 531 566 531" class="cable" style="stroke:var(--k-xl)"/>
        <path id="cPrtL" d="M360 665C360 690 300 676 300 700" class="cable" style="stroke:var(--k-pdf)"/>
        <path id="cPrtG" d="M360 665C360 690 420 676 420 700" class="cable" style="stroke:var(--k-pdf)"/>
        <g id="comTag"><rect x="530" y="278" width="48" height="22" rx="11" fill="#0E1621" stroke="#8E6CEF" stroke-width="1.5"/><text x="554" y="293" class="tagpill" text-anchor="middle" style="fill:#B79BFF">COM</text></g>

        <!-- external systems -->
        <g id="xShare" class="ext">
          <rect class="box" x="566" y="330" width="146" height="62" rx="10"/>
          <path d="M580 348h12l4 4h20v20h-36z" fill="none" stroke="#5CC8E0" stroke-width="2"/>
          <text x="624" y="356" class="ext-t">Shared</text><text x="624" y="374" class="ext-t">drive</text>
          <text x="580" y="388" class="ext-f">SMB</text>
        </g>
        <g id="xExcel" class="ext">
          <rect class="box" x="566" y="500" width="146" height="62" rx="10"/>
          <rect x="580" y="514" width="30" height="34" rx="3" fill="none" stroke="#2FA86A" stroke-width="2"/>
          <path d="M580 525h30M580 536h30M592 514v34" stroke="#2FA86A" stroke-width="1.5"/>
          <text x="620" y="527" class="ext-t">Excel</text>
          <text x="620" y="545" class="ext-f">Sign-Off.xlsx</text>
        </g>
        <g id="xPrint" class="ext">
          <g id="prL"><rect class="box" x="262" y="700" width="76" height="44" rx="8"/><rect x="274" y="708" width="52" height="5" rx="2" fill="#2B3B50"/><text x="300" y="734" class="ext-f" text-anchor="middle" style="fill:#E6EDF5">LETTER</text></g>
          <g id="prG"><rect class="box" x="382" y="700" width="76" height="44" rx="8"/><rect x="394" y="708" width="52" height="5" rx="2" fill="#2B3B50"/><text x="420" y="734" class="ext-f" text-anchor="middle" style="fill:#E6EDF5">LEDGER</text></g>
        </g>
        <g id="sheets"></g>

        <!-- the stack -->
        <g id="slabs"></g>
        <g id="pulses"></g>
        <g id="packet" style="opacity:0">
          <circle r="16" fill="#E6EDF5" opacity=".18"/>
          <circle r="9" fill="#E6EDF5"/>
        </g>
      </svg>
    </div>

    <div class="codecol">
      <div class="tabbar"><span class="tab" id="tab">IFC Print Run</span><span class="lang" id="lang">folder</span><span class="where" id="where"></span></div>
      <pre class="code" id="code" aria-live="off"></pre>
      <div class="about" id="about"></div>
    </div>

    <div class="ov ov-title" id="ovTitle">
      <div>
        <div class="part">How it's built</div>
        <h2>Under the hood</h2>
        <p>The stack behind the IFC Drawing packet printer.<br>Every line of code you'll see is from the real tool.</p>
      </div>
    </div>

    <div class="ov" id="ovBom">
      <div class="bom">
        <h2>Bill of materials</h2>
        <p class="sub">Everything the system is made of, from the email to the paper.</p>
        <table>
          <thead><tr><th>Item</th><th>Part</th><th>Type</th><th>Job</th></tr></thead>
          <tbody id="bomRows"></tbody>
        </table>
        <div class="foot" id="bomFoot"></div>
      </div>
    </div>

    <button id="bigPlay" class="bigplay start" type="button" aria-label="Play with sound"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg><span>Play</span></button>
    <div id="pausedPill" class="pill" hidden>Paused<span class="more"> · tap to resume</span></div>
  </figure>

  <section class="caption" aria-live="polite">
    <p class="cap-act" id="capAct">Under the hood</p>
    <h2 id="capH">What actually runs</h2>
    <p id="capP">What runs when an IFC email lands. Every snippet here is real code from the tool.</p>
  </section>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const DUR = 72;
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const lerp = (a, b, p) => a + (b - a) * p;
  const eio = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
  const eout = p => 1 - Math.pow(1 - p, 3);
  const op = (el, o) => { el.style.opacity = o; el.style.visibility = o <= 0.001 ? 'hidden' : 'visible'; };
  const tf = (el, s) => el.setAttribute('transform', s);
  const NS = 'http://www.w3.org/2000/svg';
  const add = (id, html) => $(id).insertAdjacentHTML('beforeend', html);

  /* ---------- the layers ---------- */
  const COL = { vba: '#8E6CEF', vbs: '#7C93B5', ps: '#3B82F6', py: '#F2C14E', pdf: '#F28C38', xl: '#2FA86A', share: '#5CC8E0' };
  const shade = (hex, k) => { const n = parseInt(hex.slice(1), 16); const c = s => Math.round(((n >> s) & 255) * k); return `rgb(${c(16)},${c(8)},${c(0)})`; };
  const CX = 360, A = 150, B = 75, H = 24;
  const LAYERS = [
    { y: 126, col: COL.vba, iso: 'VBA',  title: 'Outlook Classic', file: 'ThisOutlookSession.vba' },
    { y: 236, col: COL.vbs, iso: '.vbs', title: 'Windows Script Host', file: 'trigger.vbs' },
    { y: 346, col: COL.ps,  iso: '.ps1', title: 'PowerShell', file: 'Run-IFCPrint.ps1' },
    { y: 456, col: COL.py,  iso: '.py',  title: 'Python 3', file: 'ifc_print.py' },
    { y: 566, col: COL.pdf, iso: 'PDF',  title: 'SumatraPDF', file: 'command line' }
  ];
  const ISO = 'matrix(0.894 0.447 -0.894 0.447 0 0)';
  for (let x = 20; x < 720; x += 40) for (let y = 70; y < 700; y += 40) add('dots', `<circle cx="${x}" cy="${y}" r="1.6" class="dot"/>`);
  LAYERS.forEach((L, i) => {
    const y = L.y;
    const chips = i === 3 ? [['pywin32', 298, 446], ['pypdf', 422, 446], ['stdlib', 360, 488]].map(([n, x, cy]) =>
      `<g id="chip-${n}"><path d="M${x - 46} ${cy}L${x} ${cy - 23}L${x + 46} ${cy}L${x} ${cy + 23}Z" fill="${shade(L.col, 0.55)}" stroke="#18222E" stroke-width="2"/>
       <text class="chip-t" text-anchor="middle" transform="translate(${x} ${cy}) ${ISO}" x="0" y="4" fill="#FFF7E0">${n}</text></g>`).join('') : '';
    $('slabs').insertAdjacentHTML('afterbegin', `<g id="slab${i}">
      <path d="M${CX - A} ${y}L${CX} ${y + B}L${CX} ${y + B + H}L${CX - A} ${y + H}Z" fill="${shade(L.col, 0.62)}"/>
      <path d="M${CX} ${y + B}L${CX + A} ${y}L${CX + A} ${y + H}L${CX} ${y + B + H}Z" fill="${shade(L.col, 0.45)}"/>
      <path id="top${i}" d="M${CX - A} ${y}L${CX} ${y - B}L${CX + A} ${y}L${CX} ${y + B}Z" fill="${L.col}" stroke="#18222E" stroke-width="2"/>
      ${i === 3 ? '' : `<text class="iso" text-anchor="middle" transform="translate(${CX} ${y}) ${ISO}" x="0" y="10" fill="${shade(L.col, 0.35)}">${L.iso}</text>`}
      ${chips}
      <line x1="200" y1="${y}" x2="${CX - A - 4}" y2="${y}" class="leader"/>
      <text x="196" y="${y - 4}" class="lbl-t" text-anchor="end">${L.title}</text>
      <text x="196" y="${y + 14}" class="lbl-f" text-anchor="end">${L.file}</text>
      <path id="ck${i}" d="M${CX + A + 8} ${y - 22}l6 6 12 -14" class="chk" style="opacity:0"/>
    </g>`);
  });
  add('slabs', `<path id="ckShare" d="M690 340l6 6 12 -14" class="chk" style="opacity:0"/>`);
  for (let k = 0; k < 4; k++) add('sheets', `<g id="sh${k}" style="opacity:0"><rect x="-9" y="-12" width="${k % 2 ? 26 : 18}" height="${k % 2 ? 18 : 24}" rx="2" fill="#F7F9FB" stroke="#18222E" stroke-width="1.5"/></g>`);
  for (let k = 0; k < 4; k++) add('pulses', `<circle id="pu${k}" r="6" class="pulse" style="opacity:0"/>`);

  /* ---------- real code, step by step ---------- */
  const STEPS = [
    { t: 0, title: 'What actually runs', desc: 'What runs when an IFC email lands. Every snippet here is real code from the tool.', tab: 'IFC Print Run', lang: 'folder', lc: '#8A9BB0', where: '', code: '' },
    { t: 3.5, title: 'One folder on the shared drive', desc: 'The whole system is one folder: a VBA macro, a VBScript, two PowerShell scripts, a Python app, a JSON config, an Excel template and a bundled PDF printer.', tab: 'IFC Print Run\\', lang: 'folder', lc: '#8A9BB0', where: 'shared drive', hl: 'sh', about: '<b>Repo:</b> private on GitHub. <b>Install:</b> one copy on the shared drive that everyone runs.',
      code: String.raw`IFC Print Run\
├─ trigger.vbs
├─ requirements.txt         # pypdf, pywin32
├─ App\
│  ├─ ThisOutlookSession.vba
│  ├─ Run-IFCPrint.ps1
│  ├─ ifc_print.py          # 1,588 lines
│  ├─ config.json
│  └─ Setup.ps1
├─ Template\Sign-Off form 1.xlsx

    if (s.port === 'print') for (let x = s.t + 0.9; x < s.t + 4.8; x += 0.62) ev(x, at => { tone(170, at, 0.22, 'sawtooth', 0.05, 0.01, 900, 250); noise(at, 0.2, 0.06, 'bandpass', 1400, 1.5); });
  });
  ev(54.7, at => [1046.5, 1318.5, 1568].forEach((f, i) => ding(at + i * 0.09, f)));
  [58.6, 59.0, 59.6, 60.2, 60.8, 61.4].forEach((x, i) => ev(x, at => ding(at, 880 + i * 90)));
  ev(64.1, at => [130.81, 164.81, 196, 261.63, 329.63, 392].forEach(f => tone(f, at, 3.6, 'triangle', 0.06, 0.05, 2200)));
  for (let i = 0; i < 10; i++) ev(64.4 + i * 0.32, at => tone(520 + i * 40, at, 0.06, 'sine', 0.05));
  // a quiet pulse underneath: 100 beats per minute
  const CHORDS = [[220, 261.63, 329.63, 392], [174.61, 220, 261.63, 329.63], [261.63, 329.63, 392, 493.88], [196, 246.94, 293.66, 392]];
  for (let e = 0; 3.5 + e * 0.3 < 63.9; e++) {
    const x = 3.5 + e * 0.3, bar = Math.floor(e / 8) % 4, ch = CHORDS[bar];
    ev(x, at => tone(ch[e % 4] * (e % 8 < 4 ? 1 : 2), at, 0.22, 'triangle', 0.028, 0.005, 2600));
    if (e % 8 === 0) ev(x, at => tone(ch[0] / 2, at, 2.2, 'sine', 0.07, 0.04));
    if (e % 4 === 0) ev(x, at => tone(120, at, 0.16, 'sine', 0.3, 0.002, 0, 45));
    if (e % 2) ev(x, at => noise(at, 0.025, 0.03, 'highpass', 8000));
  }
  EV.sort((a, b) => a[0] - b[0]);
  function audioStep(prev, cur) {
    if (!AC) return;
    if (cur < prev || cur - prev > 0.3) return;
    const at = AC.currentTime + 0.02;
    for (const [et, fn] of EV) { if (et > cur) break; if (et > prev) fn(at); }
  }
  function unlockAudio() { if (!AC && !initAudio()) return; if (AC.state === 'suspended') AC.resume(); }
  ['pointerdown', 'touchstart', 'keydown'].forEach(type => document.addEventListener(type, unlockAudio, { passive: true }));

  /* ---------- tap the screen to play or pause; Restart at the end ---------- */
  let t = 0, playing = false, last = null, capIdx = -1;
  const bigPlay = $('bigPlay'), pill = $('pausedPill'), stage = $('stage');
  const ICON_PLAY = 'M8 5v14l11-7z', ICON_RESTART = 'M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z';
  function sync() {
    const atEnd = t >= DUR, mid = t > 0.01 && !atEnd;
    bigPlay.hidden = playing || mid;
    bigPlay.classList.toggle('end', atEnd); bigPlay.classList.toggle('start', !atEnd);
    bigPlay.querySelector('span').textContent = atEnd ? 'Restart' : 'Play';
    bigPlay.querySelector('path').setAttribute('d', atEnd ? ICON_RESTART : ICON_PLAY);
    bigPlay.setAttribute('aria-label', atEnd ? 'Restart' : 'Play with sound');
    pill.hidden = playing || !mid;
    const idx = stepIdx(t);
    if (idx !== capIdx) { capIdx = idx; $('capH').textContent = STEPS[idx].title; $('capP').textContent = STEPS[idx].desc; }
  }
  function toggle() { if (!playing && t >= DUR) t = 0; playing = !playing; last = null; sync(); }
  stage.addEventListener('click', e => {
    unlockAudio();
    if (t >= DUR) { if (e.target.closest('#bigPlay')) toggle(); return; }
    toggle();
  });

    const tag = (e.target.tagName || '').toLowerCase();
    if (e.code === 'Space' && tag !== 'button' && tag !== 'input') { e.preventDefault(); toggle(); }
  });
  function frame(ts) {
    if (playing) {
      if (last == null) last = ts;
      const prev = t;
      t = Math.min(DUR, t + Math.min(0.1, (ts - last) / 1000));
      last = ts;
      audioStep(prev, t);
      if (t >= DUR) playing = false;
      render(t); sync();
    } else last = null;
    requestAnimationFrame(frame);
  }
  function fitLabels() {
    document.querySelectorAll('#slabs .lbl-t').forEach(el => {
      el.style.fontSize = '';
      let fs = parseFloat(getComputedStyle(el).fontSize);
      while (el.getComputedTextLength() > 186 && fs > 12) { fs -= 1; el.style.fontSize = fs + 'px'; }
    });
  }
  function sizeCode() {
    const box = $('code'), keep = box.innerHTML;
    stage.style.removeProperty('--code-h');
    let max = 0;
    STEPS.forEach(st => {
      if (!st.code || st.bom) return;
      box.innerHTML = st.code.split('\n').map((l, i) => `<span class="row"><span class="ln">${i + 1}</span>${colour(l, st.hl)}</span>`).join('');
      max = Math.max(max, box.scrollHeight);
    });
    box.innerHTML = keep;
    stage.style.setProperty('--code-h', max + 'px');
  }
  const relayout = () => { fitLabels(); sizeCode(); };
  let rz = 0;
  addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(relayout, 150); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);
  relayout();
  window.__seek = s => { t = s; playing = false; render(t); sync(); };
  render(t); sync();
  requestAnimationFrame(frame);
})();
</script>
