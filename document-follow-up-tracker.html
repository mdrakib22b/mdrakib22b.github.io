<script type="text/plain" id="c-task">
$trigger = New-ScheduledTaskTrigger -Weekly -DaysOfWeek $days -At $From `
           -RepetitionInterval $span -RepetitionDuration $window
$argLine += ' -IfChanged'

$action    = New-ScheduledTaskAction -Execute 'powershell.exe' -Argument $argLine `
             -WorkingDirectory $root
$settings  = New-ScheduledTaskSettingsSet -MultipleInstances IgnoreNew `
             -StartWhenAvailable -DontStopIfGoingOnBatteries `
             -AllowStartIfOnBatteries -ExecutionTimeLimit (New-TimeSpan -Hours 1)
$principal = New-ScheduledTaskPrincipal -UserId $env:USERNAME -LogonType Interactive

Register-ScheduledTask -TaskName $taskName -Action $action -Trigger $trigger `
    -Settings $settings -Principal $principal -Force `
    -Description 'Rebuilds the DC Follow-Up V7 document-cycle dashboard from the Document Control Logs (read-only).' | Out-Null
</script>
<script type="text/plain" id="c-run">
$ver = Get-Content (Join-Path $root 'version.json') -Raw | ConvertFrom-Json

# Find a usable python
$py = (Get-Command python -ErrorAction SilentlyContinue).Source
if (-not $py) { $py = (Get-Command py -ErrorAction SilentlyContinue).Source }

# openpyxl is the only hard dependency
& $py -c "import openpyxl" 2>$null
if ($LASTEXITCODE -ne 0) {
    & $py -m pip install --quiet --user openpyxl
}

$argsList = @($ver.entry)
if ($IfChanged)          { $argsList += '--if-changed' }
& $py @argsList
if ($LASTEXITCODE -ne 0) { throw "$($ver.entry) failed with exit code $LASTEXITCODE" }
</script>

<script type="text/plain" id="c-email">
def _greeting(g, e):
    to = g.get("to") or []
    if len(to) > 1:
        return e.get("greeting_many", e["greeting"])
    if len(to) == 1:
        m = re.match(r'\s*"([^"]+)"', to[0])
        if m and e.get("greeting_one"):
            return e["greeting_one"].format(first=m.group(1).split()[0])
    return e["greeting"]

# No day count here: the send date says it, and the number reads as
# pressure applied to someone who may already have it in hand.

  const STEPS = [
    { t: 0, title: 'What actually runs', desc: 'What runs every hour on a weekday, from a saved Excel log to a follow-up email. Every snippet here is real code from the tool.', tab: 'DC FollowUp\\', lang: 'folder', lc: '#8A9BB0', where: '', code: '' },
    { t: 3.5, title: 'One folder, every version', desc: 'The whole tool is one folder on the shared drive: the live version in Production, one folder per version beside it, and a setup folder they all share. Seven Python files do the real work.', tab: 'DC FollowUp\\', lang: 'folder', lc: '#8A9BB0', where: 'shared drive', hl: 'sh', src: 'c-tree', about: '<b>Repo:</b> Git, on GitHub. <b>Install:</b> one copy on the shared drive. The dashboard everyone opens has one address that never changes.' },
    { t: 8.5, layer: 0, title: 'On a timer, not a person', desc: 'Windows Task Scheduler starts the runner every hour on weekdays, under the user\'s own account, so there is no admin right and no service account involved. A run never overlaps the one before it.', tab: 'Install-ScheduleV7.ps1', lang: 'Task Scheduler', lc: COL.task, where: 'no admin rights', hl: 'ps', src: 'c-task', about: '<b>Runs in:</b> Windows Task Scheduler, built into Windows. <b>Default:</b> every 60 minutes from 06:30 to 16:30, each run with -IfChanged.' },

    { t: 23.5, layer: 2, chip: 'dc_parse', port: 'logs', title: 'Reading the logs', desc: 'openpyxl opens each snapshot read-only. Every job is its own sheet. Columns are found by their header text, never by letter, because the two years\' logs are laid out differently. Each block of SENT and RTN columns is one issue of a document.', tab: 'dc_parse7.py', lang: 'Python · openpyxl', lc: COL.xl, where: '361 lines', hl: 'py', src: 'c-parse', about: '<b>Package:</b> openpyxl, the only one the main run needs. <b>Departments:</b> any header over a bare SENT column is read as an internal department.' },
    { t: 28.5, layer: 2, chip: 'folders', port: 'share', title: 'Finding every transmittal\'s folder', desc: 'Each job folder holds a Documents Sent and a Documents Received folder, one sub-folder per transmittal, named three different ways over the years. Python lists them and matches each one by transmittal number, by TRN string, or by the date at the front of the name, give or take two days.', tab: 'folders.py', lang: 'Python · SMB', lc: COL.share, where: '285 lines', hl: 'py', src: 'c-folders', about: '<b>Library:</b> os and re. <b>Opens:</b> no files at all. It reads folder names, once per run.' },
    { t: 33.5, layer: 2, chip: 'lifecycle', title: 'Whose move is it?', desc: 'lifecycle.py puts every document in one stage. Only the newest issue counts, and the client\'s code is only read once that issue has come back. Code 1 or 4 ends the cycle. Anything else means engineering owes a revision. Ages are counted in business days.', tab: 'lifecycle.py', lang: 'Python 3', lc: COL.py, where: '639 lines', hl: 'py', src: 'c-life', about: '<b>Rules live in:</b> config.json, with code classes, departments and aging bands. <b>Longest code wins,</b> so NOT APPROVED never reads as APPROVED.' },
    { t: 38.5, layer: 2, chip: 'emails', title: 'Writing the follow-ups', desc: 'Documents are grouped one card per email. A client card is one transmittal. An internal card is one job in one state. Every card gets its email ahead of time, in plain text and HTML, addressed from the sheet and the rosters in config.json.', tab: 'emails.py', lang: 'Python 3', lc: COL.py, where: '230 lines', hl: 'py', src: 'c-email', about: '<b>Client email:</b> asks for the return, with no day count. <b>Internal email:</b> To the engineer, Cc the P.M. and Document Control.' },
    { t: 43.5, layer: 2, port: 'publish', title: 'One file, every document in it', desc: 'The whole result, every document and every pre-written email, goes into one self-contained HTML file as JSON. No server, no CDN. Five CSVs are written beside it. The page is copied to the shared drive under a temporary name and swapped in, so nobody opens a half-written page.', tab: 'render_dashboard7.py', lang: 'Python 3', lc: COL.csv, where: 'json · shutil', hl: 'py', src: 'c-render', about: '<b>Page size:</b> about 4 MB. <b>CSVs:</b> lifecycle, client follow-ups, internal follow-ups, by P.M., and data quality.' },

    { t: 53.5, layer: 4, port: 'outlook', done: true, title: 'A draft, never a send', desc: 'A small PowerShell handler, registered once per PC, catches the link, unpacks the email and asks desktop Outlook for a new message over COM. It shows the draft first, so Outlook adds the user\'s own signature, then puts the follow-up above it. Nothing is ever sent.', tab: 'Open-Link.ps1', lang: 'PowerShell · COM', lc: COL.link, where: 'Outlook classic', hl: 'ps', src: 'c-link', about: '<b>Registered by:</b> Install-FolderLinks.ps1, per user, no admin. <b>Needs:</b> classic Outlook. The new Outlook has no automation interface.' },

  function words(s, lang) {
    let out = s;

  let shownKey = '';
  function renderCode(t, idx) {

    for (const k in PATHS) { PATHS[k].classList.toggle('on', cableOn[k]); op(PATHS[k], ext(1)); }

    [['xLogs', 'logs', COL.xl], ['xShare', 'share', COL.share], ['xCsv', 'csv', COL.csv], ['xOut', 'out', COL.ol]].forEach(([id, k, c]) => {

    const lanes = port ? LANES[port] : [];
    for (let k = 0; k < 4; k++) {
      const el = $('pu' + k);
      if (!lanes[k] || t < s.t + 0.4) { op(el, 0); continue; }
      let p = ((t - s.t) * 0.7 + k * 0.25) % 1;
      if (INWARD[port]) p = 1 - p;                     // the data comes in to Python
      const pt = at(lanes[k], p);
      el.setAttribute('cx', pt.x); el.setAttribute('cy', pt.y);
      el.setAttribute('fill', LANE_COL[lanes[k]]);
      op(el, Math.sin(Math.PI * p) * 0.95 + 0.05);
    }

    // drafts popping out of Outlook
    for (let k = 0; k < 4; k++) {
      const el = $('sh' + k);
      if (port !== 'outlook' || t < s.t + 0.9) { op(el, 0); continue; }
      const p = ((t - s.t - 0.9) * 0.8 + k * 0.5) % 1;
      const x = k % 2 ? 452 : 268;
      tf(el, `translate(${x} ${728 - 34 * eout(p)})`);
      op(el, 1 - p);
    }

    // the packet: drops in from the trigger, then sits in whichever layer is live
    let py = null, px = CX;
    if (t >= T_RUN && t < T_DEP && s.layer !== undefined) {
      const prevLayer = idx > 0 && STEPS[idx - 1].layer !== undefined ? STEPS[idx - 1].layer : -1;
      const fromY = prevLayer >= 0 ? LAYERS[prevLayer].y : 30 - PKT;
      const toY = LAYERS[s.layer].y;
      const p = eio(seg(t, s.t, s.t + 0.6));
      py = lerp(fromY, toY, p);
      // Going down a layer, swing out to the right so the packet never crosses the next plate's label.
      if (fromY !== toY) px = CX + 80 * Math.sin(Math.PI * p);
    }
    if (py !== null) {
      tf($('packet'), `translate(${px} ${py + PKT}) scale(${1 + 0.12 * Math.sin(t * 6)})`);
      op($('packet'), seg(t, T_RUN, T_RUN + 0.2));
      $('packet').querySelectorAll('circle').forEach(c => c.setAttribute('fill', s.lc || '#E6EDF5'));
    } else op($('packet'), 0);

    // overlays
    op($('ovTitle'), 1 - seg(t, 3.0, 3.5));
    op($('ovBom'), seg(t, T_BOM, T_BOM + 0.5));
    BOM.forEach((_, i) => $('br' + i).classList.toggle('in', t >= T_BOM + 0.4 + i * 0.32));

    renderCode(t, idx);
  }
  const DUR = T_BOM + 0.4 + BOM.length * 0.32 + 4;

  /* ---------- sound: generated in the browser, always on ---------- */
  let AC = null, OUT = null, NOISE = null;
  function initAudio() {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return false;
    AC = new Ctx();
    const comp = AC.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
    OUT = AC.createGain(); OUT.gain.value = 0.6; OUT.connect(comp); comp.connect(AC.destination);
    NOISE = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = NOISE.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return true;
  }
  function env(g, at, peak, a, dur) { g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(peak, at + a); g.gain.exponentialRampToValueAtTime(0.0001, at + dur); }
  function tone(f, at, dur, type = 'sine', peak = 0.2, a = 0.005, filt = 0, f2 = 0) {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, at);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, at + dur * 0.8);
    let node = o;
    if (filt) { const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = filt; lp.Q.value = 3; o.connect(lp); node = lp; }
    node.connect(g); g.connect(OUT); env(g, at, peak, a, dur); o.start(at); o.stop(at + dur + 0.05);
  }
  function noise(at, dur, peak, type = 'highpass', freq = 6000, q = 0.7, f2 = 0) {
    const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = NOISE; f.type = type; f.frequency.setValueAtTime(freq, at); f.Q.value = q;
    if (f2) f.frequency.exponentialRampToValueAtTime(f2, at + dur);
    s.connect(f); f.connect(g); g.connect(OUT); env(g, at, peak, 0.004, dur); s.start(at, Math.random() * 0.4); s.stop(at + dur + 0.05);
  }
  const ding = (at, f) => { tone(f, at, 0.6, 'sine', 0.16); tone(f * 2.01, at, 0.3, 'sine', 0.04); };
  const EV = [];
  const ev = (time, fn) => EV.push([time, fn]);
  ev(0.3, at => noise(at, 1.2, 0.12, 'bandpass', 300, 0.8, 4000));
  ev(1.2, at => [261.63, 392, 523.25].forEach((f, i) => ding(at + i * 0.12, f * 2)));
  LAYERS.forEach((_, i) => ev(4.4 + i * 0.55, at => { tone(110 - i * 8, at, 0.25, 'sine', 0.5, 0.002, 0, 45); noise(at, 0.06, 0.2, 'lowpass', 1200); }));
  ev(6.6, at => noise(at, 0.5, 0.06, 'bandpass', 800, 1, 3000));
  // a blip as the packet enters each layer, then typing while the code writes itself
  const BLIP = [660, 740, 830, 990, 1110];
  STEPS.forEach(s => {
    if (s.layer !== undefined) ev(s.t + 0.45, at => { tone(BLIP[s.layer], at, 0.12, 'square', 0.05, 0.003, 3000); tone(BLIP[s.layer] * 1.5, at + 0.06, 0.15, 'sine', 0.08); });
    if (s.code && !s.bom) {
      const total = s.code.length, dur = Math.min(3.2, 0.6 + total * 0.006);
      for (let x = s.t + 0.3, k = 0; x < s.t + 0.25 + dur; k++) { ev(x, at => noise(at, 0.012, 0.09, 'bandpass', 3800, 2)); x += 0.055 + ((k * 7) % 5) * 0.012; }
    }
    const f = { logs: [520, 780], share: [600, 700], publish: [440, 700] }[s.port];
    if (f) for (let x = s.t + 0.7; x < s.t + 4.8; x += 0.7) ev(x, at => tone(f[0], at, 0.18, 'sine', 0.07, 0.01, 0, f[1]));
    if (s.port === 'outlook') for (let x = s.t + 0.9; x < s.t + 4.8; x += 0.62) ev(x, at => { tone(880, at, 0.14, 'sine', 0.06); noise(at, 0.12, 0.04, 'bandpass', 2400, 1.5, 6000); });
  });
  ev(T_DONE + 1.2, at => [1046.5, 1318.5, 1568].forEach((f, i) => ding(at + i * 0.09, f)));
  [T_DEP + 0.1, ...[4, 3, 2, 1, 0].map(depT)].forEach((x, i) => ev(x, at => ding(at, 880 + i * 90)));
  ev(T_BOM + 0.1, at => [130.81, 164.81, 196, 261.63, 329.63, 392].forEach(f => tone(f, at, 3.6, 'triangle', 0.06, 0.05, 2200)));
  BOM.forEach((_, i) => ev(T_BOM + 0.4 + i * 0.32, at => tone(520 + i * 40, at, 0.06, 'sine', 0.05)));
  // a quiet pulse underneath: 100 beats per minute
  const CHORDS = [[220, 261.63, 329.63, 392], [174.61, 220, 261.63, 329.63], [261.63, 329.63, 392, 493.88], [196, 246.94, 293.66, 392]];
  for (let e = 0; 3.5 + e * 0.3 < T_BOM - 0.6; e++) {
    const x = 3.5 + e * 0.3, bar = Math.floor(e / 8) % 4, ch = CHORDS[bar];
    ev(x, at => tone(ch[e % 4] * (e % 8 < 4 ? 1 : 2), at, 0.22, 'triangle', 0.028, 0.005, 2600));
    if (e % 8 === 0) ev(x, at => tone(ch[0] / 2, at, 2.2, 'sine', 0.07, 0.04));
    if (e % 4 === 0) ev(x, at => tone(120, at, 0.16, 'sine', 0.3, 0.002, 0, 45));
    if (e % 2) ev(x, at => noise(at, 0.025, 0.03, 'highpass', 8000));
  }
  EV.sort((a, b) => a[0] - b[0]);
  function audioStep(prev, cur) {
    if (!AC) return;
    if (cur < prev || cur - prev > 0.3) return;
    const at = AC.currentTime + 0.02;
    for (const [et, fn] of EV) { if (et > cur) break; if (et > prev) fn(at); }
  }
  function unlockAudio() { if (!AC && !initAudio()) return; if (AC.state === 'suspended') AC.resume(); }
  ['pointerdown', 'touchstart', 'keydown'].forEach(type => document.addEventListener(type, unlockAudio, { passive: true }));

  /* ---------- tap the screen to play or pause; Restart at the end ---------- */
  let t = 0, playing = false, last = null, capIdx = -1;
  const bigPlay = $('bigPlay'), pill = $('pausedPill'), stage = $('stage');
  const ICON_PLAY = 'M8 5v14l11-7z', ICON_RESTART = 'M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z';
  function sync() {
    const atEnd = t >= DUR, mid = t > 0.01 && !atEnd;
    bigPlay.hidden = playing || mid;
    bigPlay.classList.toggle('end', atEnd); bigPlay.classList.toggle('start', !atEnd);
    bigPlay.querySelector('span').textContent = atEnd ? 'Restart' : 'Play';
    bigPlay.querySelector('path').setAttribute('d', atEnd ? ICON_RESTART : ICON_PLAY);
    bigPlay.setAttribute('aria-label', atEnd ? 'Restart' : 'Play with sound');
    pill.hidden = playing || !mid;
    const idx = stepIdx(t);
    if (idx !== capIdx) { capIdx = idx; $('capH').textContent = STEPS[idx].title; $('capP').textContent = STEPS[idx].desc; }
  }
  function toggle() { if (!playing && t >= DUR) t = 0; playing = !playing; last = null; sync(); }
  stage.addEventListener('click', e => {
    unlockAudio();
    if (t >= DUR) { if (e.target.closest('#bigPlay')) toggle(); return; }
    toggle();
  });
  document.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (e.code === 'Space' && tag !== 'button' && tag !== 'input') { e.preventDefault(); toggle(); }
  });
  function frame(ts) {
    if (playing) {
      if (last == null) last = ts;
      const prev = t;
      t = Math.min(DUR, t + Math.min(0.1, (ts - last) / 1000));
      last = ts;
      audioStep(prev, t);
      if (t >= DUR) playing = false;
      render(t); sync();
    } else last = null;
    requestAnimationFrame(frame);
  }
  function fitLabels() {
    document.querySelectorAll('#slabs .lbl-t').forEach(el => {
      el.style.fontSize = '';
      let fs = parseFloat(getComputedStyle(el).fontSize);
      while (el.getComputedTextLength() > 186 && fs > 12) { fs -= 1; el.style.fontSize = fs + 'px'; }
    });
  }
  function sizeCode() {
    const box = $('code'), keep = box.innerHTML;
    stage.style.removeProperty('--code-h');
    let max = 0;
    STEPS.forEach(st => {
      if (!st.code || st.bom) return;
      box.innerHTML = st.code.split('\n').map((l, i) => `<span class="row"><span class="ln">${i + 1}</span>${colour(l, st.hl)}</span>`).join('');
      max = Math.max(max, box.scrollHeight);
    });
    box.innerHTML = keep;
    stage.style.setProperty('--code-h', max + 'px');
  }
  const relayout = () => { fitLabels(); sizeCode(); };
  let rz = 0;
  addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(relayout, 150); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);
  relayout();
  window.__seek = s => { t = s; playing = false; render(t); sync(); };
  window.__steps = STEPS.map(s => s.t);
  render(t); sync();
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
